syntax = "proto3";

package ro.distributed.kv;

option java_multiple_files = true;
option java_package = "ro.distributed.kv.proto";

service KeyValueService {
  // --- 1. Client Facing API (Coordinated / Routed via Consistent Hash Ring) ---
  rpc Put (PutRequest) returns (PutResponse);
  rpc Get (GetRequest) returns (GetResponse);
  rpc Delete (DeleteRequest) returns (DeleteResponse);

  // --- 2. Internal Node-to-Node API (Direct local execution without re-routing) ---
  rpc InternalPut (InternalPutRequest) returns (InternalPutResponse);
  rpc InternalGet (InternalGetRequest) returns (InternalGetResponse);
  rpc InternalDelete (InternalDeleteRequest) returns (InternalDeleteResponse);
  rpc Heartbeat (HeartbeatRequest) returns (HeartbeatResponse);
}

// Client Put
message PutRequest {
  string key = 1;
  bytes value = 2;
}

message PutResponse {
  bool success = 1;
  string message = 2;
  string stored_on_node = 3;
}

// Client Get
message GetRequest {
  string key = 1;
}

message GetResponse {
  bool found = 1;
  bytes value = 2;
  int64 timestamp = 3;
  int64 version = 4;
  string served_by_node = 5;
}

// Client Delete
message DeleteRequest {
  string key = 1;
}

message DeleteResponse {
  bool success = 1;
  string message = 2;
}

// Internal Node-to-Node Put
message InternalPutRequest {
  string key = 1;
  bytes value = 2;
  int64 timestamp = 3;
  int64 version = 4;
  bool tombstone = 5;
}

message InternalPutResponse {
  bool success = 1;
  string message = 2;
}

// Internal Node-to-Node Get
message InternalGetRequest {
  string key = 1;
}

message InternalGetResponse {
  bool found = 1;
  bytes value = 2;
  int64 timestamp = 3;
  int64 version = 4;
  bool tombstone = 5;
}

// Internal Node-to-Node Delete
message InternalDeleteRequest {
  string key = 1;
}

message InternalDeleteResponse {
  bool success = 1;
}

// Heartbeat
message HeartbeatRequest {
  string sender_id = 1;
  int64 timestamp = 2;
}

message HeartbeatResponse {
  string receiver_id = 1;
  bool active = 2;
  int64 timestamp = 3;
}
